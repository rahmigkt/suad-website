<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürün — SUAD</title>
<link rel="icon" href="assets/logo/mark-copper.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/brand.css">
<style>
  .product-page{padding:150px 0 100px;}
  .breadcrumb{font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--label); margin-bottom:36px;}
  .breadcrumb a{color:var(--brass-light); text-decoration:none;}
  .product-layout{display:grid; grid-template-columns:1.1fr 0.9fr; gap:60px; align-items:start;}
  .product-image{aspect-ratio:1/1; background:var(--bg-panel); border:1px solid var(--hairline); overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:zoom-in; position:relative;}
  .product-image img{width:100%; height:100%; object-fit:cover;}
  .product-image svg{width:35%; height:35%; stroke:var(--brass); fill:none; stroke-width:1.2;}
  .product-image .zoom-hint{position:absolute; right:14px; bottom:14px; font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink); background:rgba(237,230,216,0.9); padding:6px 12px;}
  .thumb-strip{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .thumb-strip img{width:64px; height:64px; object-fit:cover; border:1px solid var(--hairline); cursor:pointer; opacity:0.6; transition:opacity .2s;}
  .thumb-strip img:hover, .thumb-strip img.active{opacity:1; border-color:var(--brass-light);}
  .product-info h1{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(30px,4vw,44px); margin:0 0 20px; letter-spacing:-0.01em;}
  .product-info .desc{color:var(--ink-dim); font-size:17px; line-height:1.75; margin-bottom:36px;}
  .p-specs{border-top:1px solid var(--hairline); margin-bottom:36px;}
  .p-spec-row{display:flex; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--hairline); font-size:14px;}
  .p-spec-row .k{font-family:'Space Mono', monospace; letter-spacing:0.06em; text-transform:uppercase; color:var(--label); font-size:12px;}
  .p-spec-row .v{color:var(--ink);}
  @media (max-width:860px){ .product-layout{grid-template-columns:1fr;} }

  .lightbox{position:fixed; inset:0; z-index:200; background:rgba(10,9,7,0.96); display:none; align-items:center; justify-content:center; padding:40px;}
  .lightbox.active{display:flex;}
  .lightbox img{max-width:90vw; max-height:82vh; object-fit:contain; box-shadow:0 30px 80px rgba(0,0,0,0.5);}
  .lightbox-close{position:absolute; top:24px; right:32px; font-family:'Space Mono', monospace; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-dim); background:none; border:1px solid var(--hairline-strong); padding:10px 18px; cursor:pointer;}
  .lightbox-close:hover{color:var(--ink); border-color:var(--brass-light);}
  .lightbox-nav{position:absolute; top:50%; transform:translateY(-50%); background:none; border:1px solid var(--hairline-strong); color:var(--ink-dim); width:48px; height:48px; border-radius:50%; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;}
  .lightbox-nav:hover{color:var(--brass-light); border-color:var(--brass-light);}
  .lightbox-prev{left:24px;} .lightbox-next{right:24px;}
  .lightbox-count{position:absolute; bottom:24px; left:50%; transform:translateX(-50%); font-family:'Space Mono', monospace; font-size:12px; color:var(--ink-dim); letter-spacing:0.06em;}
</style>
</head>
<body>

<header>
  <div class="navbar">
    <a href="index.html" class="wordmark"><img src="assets/logo/mark-copper.png" alt="Suad"> SUAD</a>
    <div class="navlinks">
      <a href="index.html#koleksiyon">Koleksiyon</a>
      <a href="index.html#manifesto">Manifesto</a>
      <a href="index.html#iletisim" class="cta-link">Teklif Al</a>
    </div>
  </div>
</header>

<section class="product-page">
  <div class="wrap">
    <div class="breadcrumb" id="breadcrumb"><a href="index.html">Ana Sayfa</a> / <span id="bcCat"></span> / <span id="bcProduct"></span></div>
    <div class="product-layout" id="layout">
      <div class="product-image skeleton"></div>
      <div class="product-info">
        <div class="skeleton" style="height:40px;width:70%;margin-bottom:20px;"></div>
        <div class="skeleton" style="height:100px;"></div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap foot-inner">
    <span class="foot-word">SUAD</span>
    <span class="foot-meta">Handcrafted Brass &amp; Copper</span>
    <span class="foot-meta">© 2026 Suad</span>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">Kapat ✕</button>
  <button class="lightbox-nav lightbox-prev" onclick="lbNav(-1)">←</button>
  <img id="lightboxImg" src="" alt="Yakından görünüm">
  <button class="lightbox-nav lightbox-next" onclick="lbNav(1)">→</button>
  <span class="lightbox-count" id="lightboxCount"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/shared.js"></script>
<script>
let allImages = [];

async function init(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const layout = document.getElementById('layout');
  if (!slug) { layout.innerHTML = '<p>Ürün bulunamadı.</p>'; return; }

  const { data: p, error } = await sb.from('suad_products').select('*, suad_categories(name, slug)').eq('slug', slug).maybeSingle();
  if (error || !p) { layout.innerHTML = '<p>Bu ürün mevcut değil.</p>'; return; }

  document.title = p.title + ' — SUAD';
  const cat = p.suad_categories;
  if (cat) {
    document.getElementById('bcCat').innerHTML = '<a href="kategori.html?slug='+encodeURIComponent(cat.slug)+'" style="color:var(--brass-light);text-decoration:none;">'+escapeHtml(cat.name)+'</a>';
  }
  document.getElementById('bcProduct').textContent = p.title;

  // Ana görsel + ek görseller (yakından görünüm galerisi)
  const extraImages = Array.isArray(p.images) ? p.images.map(publicImageUrl).filter(Boolean) : [];
  const primaryImg = publicImageUrl(p.image_url);
  allImages = [primaryImg, ...extraImages].filter(Boolean);

  const media = allImages.length > 0
    ? '<img id="mainProductImg" src="'+allImages[0]+'" alt="'+escapeHtml(p.title)+'"><span class="zoom-hint">Yakınlaştır ⤢</span>'
    : categoryIcon(cat ? cat.slug : 'default');

  const thumbs = allImages.length > 1
    ? '<div class="thumb-strip" id="thumbStrip">' + allImages.map((src, i) =>
        '<img src="'+src+'" class="'+(i===0?'active':'')+'" onclick="selectMainImage('+i+')">'
      ).join('') + '</div>'
    : '';

  let specsHtml = '';
  if (p.material) specsHtml += '<div class="p-spec-row"><span class="k">Malzeme</span><span class="v">'+escapeHtml(p.material)+'</span></div>';
  if (p.technique) specsHtml += '<div class="p-spec-row"><span class="k">Teknik</span><span class="v">'+escapeHtml(p.technique)+'</span></div>';
  if (Array.isArray(p.custom_fields)) {
    p.custom_fields.forEach(f => {
      if (f && f.label) specsHtml += '<div class="p-spec-row"><span class="k">'+escapeHtml(f.label)+'</span><span class="v">'+escapeHtml(f.value||'')+'</span></div>';
    });
  }

  layout.innerHTML =
    '<div>'+
      '<div class="product-image" onclick="openLightboxAt(currentImgIndex||0)">'+media+'</div>'+
      thumbs+
    '</div>'+
    '<div class="product-info">'+
      '<h1>'+escapeHtml(p.title)+'</h1>'+
      (p.description ? '<div class="desc">'+escapeHtml(p.description)+'</div>' : '')+
      (specsHtml ? '<div class="p-specs">'+specsHtml+'</div>' : '')+
      '<a href="index.html#iletisim" class="btn btn-solid">Teklif İste →</a>'+
    '</div>';
}

let currentImgIndex = 0;
function selectMainImage(i){
  currentImgIndex = i;
  document.getElementById('mainProductImg').src = allImages[i];
  document.querySelectorAll('#thumbStrip img').forEach((el, idx) => el.classList.toggle('active', idx===i));
}

// ---- Lightbox ----
let lbImages = [], lbIndex = 0;
function openLightboxAt(startIndex){
  if (allImages.length === 0) return;
  lbImages = allImages;
  lbIndex = startIndex || 0;
  renderLightbox();
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox(){ document.getElementById('lightbox').classList.remove('active'); }
function lbNav(dir){ lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length; renderLightbox(); }
function renderLightbox(){
  document.getElementById('lightboxImg').src = lbImages[lbIndex];
  document.getElementById('lightboxCount').textContent = (lbIndex+1) + ' / ' + lbImages.length;
  document.querySelectorAll('.lightbox-nav').forEach(b => b.style.display = lbImages.length > 1 ? 'flex' : 'none');
}
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
});

init();
</script>
</body>
</html>
